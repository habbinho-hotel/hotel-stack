server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Configuração do cliente: sempre buscar de novo (é gerada no start do container)
    location /configuration/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Arquivos do build com hash no nome
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Assets do jogo (volume ./gamedata): furni, roupas, config/*.json, sons, ícones...
    location /gamedata/ {
        alias /usr/share/nginx/gamedata/;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
